settings:
  lib_name: nor2b_schematic
  units:
    time: ns
    voltage: V
    current: uA
    pulling_resistance: kOhm
    leakage_power: nW
    capacitive_load: pF
    energy: fJ
  named_nodes:
    - name: vdd
      voltage: 1.8
    - name: vss
      voltage: 0.0

includes:
  - sky130A/libs.tech/ngspice/sky130.lib.spice tt
  - cells/nor2b.spice

cells:
  nor2b:
    pins:
      inputs:
        - a
        - b
      outputs:
        - name: y
          function: "(a & !b)"